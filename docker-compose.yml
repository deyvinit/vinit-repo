services:
  # 1. Database Layer (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tododb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - todo-network

  # 2. Rust Microservice (GET 'hello world' & Bonus DELETE)
  rust-api:
    build:
      context: ./rust-api
      dockerfile: Dockerfile
    container_name: todo-rust-api
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tododb}
      RUST_LOG: info
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network

  # 3. Middleware (Python FastAPI CRUD + Rust Delegation)
  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: todo-middleware
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tododb}
      RUST_API_URL: http://rust-api:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rust-api:
        condition: service_started
    networks:
      - todo-network

  # 4. Authentication (Keycloak OIDC Provider with Auto Realm Import)
  auth:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: todo-auth
    restart: always
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/"
    ports:
      - "8082:8080"
    volumes:
      - ./auth/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - todo-network

  # 5. Frontend (Vanilla Web UI & Reverse Proxy via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - middleware
      - auth
    networks:
      - todo-network

volumes:
  postgres_data:
    driver: local

networks:
  todo-network:
    driver: bridge
