<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>Todo Assessment App</h1>
                <div id="auth-box" class="auth-box">
                    <span id="user-display">Checking session...</span>
                    <button id="auth-btn" class="auth-btn">Sign In</button>
                </div>
            </div>
            <div id="rust-badge" class="badge">
                Checking Rust worker...
            </div>
        </header>

        <!-- Keycloak Login Gate -->
        <section id="login-gate" class="login-gate hidden">
            <div class="gate-card">
                <h2>🔒 Keycloak Authentication Required</h2>
                <p>Please log in via Keycloak to access and manage todos.</p>
                <button id="gate-login-btn" class="gate-btn">Sign in with Keycloak</button>
                <div class="hint">Demo credentials: <b>testuser</b> / <b>password123</b></div>
            </div>
        </section>

        <!-- App Content (Visible when authenticated) -->
        <div id="app-content">
            <section class="add-section">
                <form id="todo-form">
                    <input type="text" id="todo-title" placeholder="Enter new todo title..." required autocomplete="off">
                    <input type="text" id="todo-desc" placeholder="Optional description..." autocomplete="off">
                    <button type="submit" id="add-btn">Add Todo</button>
                </form>
            </section>

            <section class="list-section">
                <h2>Current Tasks</h2>
                <div id="loading" class="info-text">Loading tasks...</div>
                <ul id="todo-list"></ul>
            </section>
        </div>

        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
